<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Valorant System</title>
    </head>
<body style="background-color: #0f1923; color: white; font-family: 'Oswald', sans-serif;">

    <div style="max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #ff4655;">
        <h2 style="text-align: center; color: #ff4655;">DAFTAR AKUN</h2>
        
        <form action="/register" method="POST">
            <div style="margin-bottom: 15px;">
                <label>Username</label>
                <input type="text" name="username" style="width: 100%; padding: 8px; background: #1f2326; border: 1px solid #383e42; color: white;" required>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Password</label>
                <input type="password" name="password" style="width: 100%; padding: 8px; background: #1f2326; border: 1px solid #383e42; color: white;" required>
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background: #ff4655; color: white; border: none; cursor: pointer;">
                DAFTAR SEKARANG
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; font-size: 13px;">
            Sudah punya akun? <a href="/login" style="color: #00eeff; text-decoration: none;">Login di sini</a>
        </p>
    </div>

</body>
</html>
